# Builds the Windows app (WhatsAppAnalyzer-windows.zip) on a Windows machine.
# Runs by hand (Actions tab -> Build Windows app -> Run workflow) or when a tag like v1.0 is pushed;
# for tags the zip is also attached to a GitHub release.
name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dashboard.txt
            requirements-build.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dashboard.txt -r requirements-build.txt pytest

      - name: Tests (transformer tests are skipped: no PyTorch here)
        run: |
          python tests/make_fake_chats.py tests/fake_chats
          python -m pytest tests -q
        env:
          PYTHONPATH: ".;tests"
          PYTHONUTF8: "1"

      - name: Build
        run: pyinstaller whatsapp_analyzer.spec --noconfirm --clean

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $exe = "dist\WhatsAppAnalyzer\WhatsAppAnalyzer.exe"
          & $exe --explain "seni seviom aşkm"
          if ($LASTEXITCODE -ne 0) { throw "explain failed" }
          & $exe tests\fake_chats\pair_ios_export.zip -o smoke_report.html --bootstrap 100
          if ($LASTEXITCODE -ne 0) { throw "report failed" }
          if ((Get-Item smoke_report.html).Length -lt 100000) { throw "report too small" }
          # dashboard: must answer on its port within 90 s
          $p = Start-Process $exe -ArgumentList "--no-browser" -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep 1
            try { $r = Invoke-WebRequest http://127.0.0.1:8501/_stcore/health -UseBasicParsing; if ($r.Content -match "ok") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "dashboard did not start" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\WhatsAppAnalyzer -DestinationPath WhatsAppAnalyzer-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WhatsAppAnalyzer-windows
          path: WhatsAppAnalyzer-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WhatsAppAnalyzer-windows.zip
